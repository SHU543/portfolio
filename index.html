<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>王兆晗 · 作品集 2026</title>
<meta name="description" content="王兆晗的作品集：游戏 UI、美术与 AIGC。2027 届，虚拟现实技术应用，专业第一。">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/dark.css">
<style>
  html,body{height:100%;overflow:hidden;background:#000}
  .cover{position:relative;height:100vh;min-height:520px;overflow:hidden;background:#000}
  .cover video,.cover .poster{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:saturate(1) brightness(.96);
  }
  .cover .poster{display:none}
  .cover::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(46% 34% at 0% 0%,rgba(0,0,0,.86) 0%,rgba(0,0,0,0) 72%),
      radial-gradient(46% 34% at 100% 0%,rgba(0,0,0,.86) 0%,rgba(0,0,0,0) 72%),
      radial-gradient(40% 26% at 0% 100%,rgba(0,0,0,.8) 0%,rgba(0,0,0,0) 72%),
      radial-gradient(40% 26% at 100% 100%,rgba(0,0,0,.8) 0%,rgba(0,0,0,0) 72%),
      linear-gradient(180deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,.02) 30%,rgba(0,0,0,.08) 60%,rgba(0,0,0,.86) 100%);
  }
  .cover-ui{position:absolute;top:20px;right:var(--pad);z-index:6;display:flex;gap:10px}
  .ui-pill{
    display:inline-flex;align-items:center;gap:7px;
    height:34px;padding:0 14px;border-radius:999px;
    border:1px solid rgba(255,255,255,.26);background:rgba(8,8,10,.55);
    color:rgba(255,255,255,.86);font:inherit;font-size:12px;letter-spacing:.06em;
    cursor:pointer;text-decoration:none;backdrop-filter:blur(10px);transition:.2s;
  }
  .ui-pill:hover{background:#fff;color:#000;border-color:#fff}
  .ui-pill.is-on{background:rgba(33,150,243,.92);border-color:transparent;color:#fff}
  .cover-bottom{
    position:absolute;left:0;right:0;bottom:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;gap:16px;
    padding:0 var(--pad) clamp(40px,7vh,74px);
  }
  .cover-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .cover-actions .btn{height:52px;padding:0 34px;font-size:15.5px}
  .cover-actions .btn--solid{box-shadow:0 14px 44px rgba(33,150,243,.45)}
  .cover-hint{font-size:11.5px;letter-spacing:.14em;color:rgba(255,255,255,.5)}
  @media (max-width:760px){
    .cover video{display:none}
    .cover .poster{display:block}
    .cover-actions .btn{height:46px;padding:0 20px;font-size:14px}
    .cover-ui{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .cover video{display:none}
    .cover .poster{display:block}
    .cover-ui{display:none}
  }
</style>
</head>
<body>
<div class="cover">
  <video id="hero" src="assets/video/cover.mp4" poster="assets/video/cover-poster.jpg"
         autoplay muted loop playsinline preload="auto" aria-label="作品集开场动画"></video>
  <img class="poster" src="assets/video/cover-poster.jpg" alt="作品集封面">
  <audio id="bgm" src="assets/video/cover.mp3" loop preload="none"></audio>

  <div class="cover-ui">
    <a class="ui-pill" href="portfolio.html">跳过开场 →</a>
    <button class="ui-pill" id="soundBtn" type="button" aria-pressed="false">
      <span id="soundIcon">🔈</span><span id="soundTxt">开声音</span>
    </button>
  </div>

  <div class="cover-bottom">
    <div class="cover-actions">
      <a class="btn btn--solid" href="portfolio.html">进入作品集</a>
      <a class="btn" href="works.html">直接看 73 件作品</a>
    </div>
    <p class="cover-hint">专业第一 · 1 / 142 · 4 个项目 / 73 件作品</p>
  </div>
</div>

<script src="assets/cursor.js" defer></script>
<script>
(function () {
  var v = document.getElementById('hero');
  var a = document.getElementById('bgm');
  var btn = document.getElementById('soundBtn');
  var icon = document.getElementById('soundIcon');
  var txt = document.getElementById('soundTxt');
  var on = false;

  if (v) {
    var p = v.play();
    if (p && p.catch) p.catch(function () { v.style.display = 'none'; });
  }

  function sync() {
    // 让音乐与画面处在同一时间点
    try {
      if (a && v && isFinite(v.currentTime)) a.currentTime = v.currentTime % (a.duration || 1);
    } catch (e) {}
  }

  if (btn && a) {
    btn.addEventListener('click', function () {
      if (!on) {
        sync();
        a.play().catch(function () {});
        on = true;
        btn.classList.add('is-on');
        btn.setAttribute('aria-pressed', 'true');
        icon.textContent = '🔊';
        txt.textContent = '静音';
      } else {
        a.pause();
        on = false;
        btn.classList.remove('is-on');
        btn.setAttribute('aria-pressed', 'false');
        icon.textContent = '🔈';
        txt.textContent = '开声音';
      }
    });
  }

  // 视频循环时把音乐拉回同一时间点
  if (v) v.addEventListener('seeked', function () { if (on) sync(); });
})();
</script>
<script src="assets/spotlight.js" defer></script>
</body>
</html>
